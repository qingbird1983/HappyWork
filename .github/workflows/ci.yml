# CI —— 门禁流水线（Go + 前端 TS + 三平台构建；命令与 docs/standards/04 §1、05 §1 保持一致）
# 门禁组合：gofmt / golangci-lint / go test / 前端 lint+typecheck / check-size（体量哨兵）。
# Phase 1 验收 A1（一票否决）：windows/macos/linux 三平台 wails3 build 矩阵。
# Linux 依赖：Wails v3.0.0 默认后端 = GTK4 + WebKitGTK 6.0（pkg-config: gtk4 webkitgtk-6.0）。

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.26"

      # Wails 及其依赖在 Linux 上经 pkg-config 找 gtk4/webkitgtk-6.0，
      # 缺失时 golangci-lint / go test 连类型检查都过不了。
      - name: 安装 Linux GUI 依赖（Wails 运行时）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # ── Go 门禁 ──────────────────────────────────────────
      - name: fmt（格式化检查）
        run: |
          if [ -f go.mod ]; then
            test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          else
            echo "skip: go.mod not present (pre-code phase)"
          fi
      - name: lint（golangci-lint，standards/01 硬门槛）
        if: hashFiles('go.mod') != ''
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: test
        if: hashFiles('go.mod') != ''
        run: go test ./...

      # ── 前端门禁（ADR-0007）─────────────────────────────
      - name: frontend lint & typecheck（React + TS）
        if: hashFiles('frontend/package.json') != ''
        run: cd frontend && npm ci && npm run lint && npm run typecheck && npm run format:check && npm run test:unit

      # ── 渲染安全门禁（A6）───────────────────────────────
      - name: check-render-safety
        run: bash scripts/check-render-safety.sh

      # ── 体量哨兵 ────────────────────────────────────────
      - name: check-size
        run: bash scripts/check-size

  # A1 三平台构建（roadmap phase-1 §5）。
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.26"

      - name: 安装 Linux GUI 依赖（Wails 运行时）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 wails3 CLI（钉 v3.0.0，ADR-0001）
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      # shell: bash——Windows 默认 pwsh 会把 $(...) 当 PowerShell 子表达式解析。
      - name: wails3 build
        shell: bash
        run: "$(go env GOPATH)/bin/wails3 build"
