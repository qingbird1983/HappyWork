# CI —— 门禁流水线（Go + 前端 TS；命令与 docs/standards/04 §1、05 §1 保持一致）
# 门禁组合固定四连：格式化检查 / lint / 测试 / check-size（体量哨兵）。
# Pre-code 阶段（go.mod 未落地）：Go 步骤以守卫条件跳过，check-size 始终执行。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.26"

      # ── 门禁四连 ──────────────────────────────────────────
      - name: fmt（格式化检查）
        run: |
          if [ -f go.mod ]; then
            test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          else
            echo "skip: go.mod not present (pre-code phase)"
          fi
      - name: lint（硬门槛）
        run: |
          if [ -f go.mod ]; then
            go vet ./...
          else
            echo "skip: go.mod not present (pre-code phase)"
          fi
      - name: test
        run: |
          if [ -f go.mod ]; then
            go test ./...
          else
            echo "skip: go.mod not present (pre-code phase)"
          fi
      - name: check-size（体量哨兵）
        run: bash scripts/check-size
