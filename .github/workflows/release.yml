# Release —— 三平台签名与发布（docs/design/phase-4/release-signing.md、ADR-0017）
# 触发：annotated tag v*（正式发布）；workflow_dispatch（dry-run：只验证流水线，永不发布）。
# 凭据纪律：证书/私钥/口令只来自 GitHub Actions Secrets，不进仓库、日志或产物。
# 缺凭据时正式标签一律失败：绝不降级为"未签名也算发布成功"。
# dry-run 使用 runner 内临时凭据，产物名带 preview 标记，release job 永远不会拿到它们。
#
# 成本与平台策略（所有者 2026-10-31 决定，ADR-0018）：首发平台优先，dry-run 默认**只跑 windows**，
# macOS/Linux 需在 workflow_dispatch 里显式勾选（正式标签仍然三平台全跑）。
# 每个 job 都有 timeout-minutes：run 41102612818 里 windows 的"准备签名证书"步骤静默挂住 63 分钟、
# 白烧约 133 分钟额度（Windows 分钟按 2× 计），原因就是没有超时上界（P-016）。

name: Release

on:
  push:
    tags:
      - "v*"
  # workflow_dispatch 一律是 dry-run：没有标签可比版本，也不会进入 release job。
  workflow_dispatch:
    inputs:
      platforms:
        description: dry-run 要覆盖的平台（首发只看 windows）
        type: choice
        required: false
        default: windows
        options:
          - windows
          - "windows,linux"
          - "windows,linux,macos"

permissions:
  contents: read

# 同一 ref 上重复触发时取消旧运行，避免排队叠加消耗分钟。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  WAILS_CLI_VERSION: "v3.0.0" # 与 CI 一致（ADR-0001）
  BINARY: happywork # wails3 build 在 Linux/macOS 用它；Windows 为 happywork.exe

jobs:
  # ── 发布门禁：版本一致性 + 全量门禁，失败则不进入任何构建 ──
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.plan.outputs.version }}
      label: ${{ steps.plan.outputs.label }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本、产物标签与平台范围
        id: plan
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            bash scripts/check-version.sh "$GITHUB_REF_NAME"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "label=release" >> "$GITHUB_OUTPUT"
            # 正式标签：三平台必须齐全，缺一即失败（不允许"少一个包也发"）。
            echo "platforms=windows,linux,macos" >> "$GITHUB_OUTPUT"
          else
            # dry-run 没有标签可比，直接采用配置版本；产物标记为预览
            version="$(sed -n '/^info:/,/^[^[:space:]#]/p' build/config.yml |
              sed -n 's/^[[:space:]]*version:[[:space:]]*"\{0,1\}\([^"#[:space:]]*\)"\{0,1\}.*/\1/p' |
              head -n1)"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "label=dry-run-preview" >> "$GITHUB_OUTPUT"
            platforms="${{ github.event.inputs.platforms || 'windows' }}"
            echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
            echo "dry-run 平台范围：$platforms"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 安装 Linux GUI 依赖（Wails 运行时）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Go 门禁
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - name: 前端门禁
        run: cd frontend && npm ci && npm run lint && npm run typecheck && npm run format:check && npm run test:unit

      - name: 体量与渲染安全门禁
        run: bash scripts/check-size && bash scripts/check-render-safety.sh

  # ── Windows：Authenticode（exe + NSIS 安装包）──
  windows:
    needs: prepare
    if: contains(needs.prepare.outputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 安装 wails3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_CLI_VERSION }}

      - name: 安装 makensis（NSIS）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }

      - name: 构建
        shell: bash
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/wails3" build

      # 正式：从 Secret 还原 PFX。dry-run：在内存里造一张一次性自签代码签名证书，导出 PFX，
      # **不碰任何证书存储**。
      # 教训（P-016，run 41102612818）：原先用 New-SelfSignedCertificate 写 CurrentUser\My，再把证书
      # Add 进 CurrentUser\Root 好让 signtool /pa 走真链路——导入受信任根会触发系统确认对话框，
      # 无人值守 runner 上没人点，job 静默挂死 63 分钟才被系统掐掉，白烧约 133 分钟 Windows 额度。
      - name: 准备签名证书
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          IS_TAG: ${{ github.event_name == 'push' }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "happywork-signing.pfx"
          if ($env:PFX_BASE64) {
            if (-not $env:PFX_PASSWORD) { Write-Error "已配置 WINDOWS_PFX_BASE64 但口令为空"; exit 1 }
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            "password=$env:PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "mode=real" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ($env:IS_TAG -eq "True") {
            Write-Error "正式标签缺少 WINDOWS_PFX_BASE64/WINDOWS_PFX_PASSWORD：拒绝发布未签名产物"
            exit 1
          } else {
            $rsa = [Security.Cryptography.RSA]::Create(2048)
            $subject = New-Object System.Security.Cryptography.X500DistinguishedName "CN=HappyWork Dry-Run"
            $req = New-Object System.Security.Cryptography.X509Certificates.CertificateRequest(
              $subject, $rsa,
              [Security.Cryptography.HashAlgorithmName]::SHA256,
              [Security.Cryptography.RSASignaturePadding]::Pkcs1)
            $req.CertificateExtensions.Add(
              New-Object Security.Cryptography.X509Certificates.X509BasicConstraintsExtension(
                $false, $false, 0, $true))
            $ekus = New-Object System.Security.Cryptography.OidCollection
            [void]$ekus.Add((New-Object System.Security.Cryptography.Oid "1.3.6.1.5.5.7.3.3"))
            $req.CertificateExtensions.Add(
              (New-Object System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension(
                $ekus, $false)))
            $req.CertificateExtensions.Add(
              (New-Object System.Security.Cryptography.X509Certificates.X509KeyUsageExtension(
                [Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature, $true)))
            $cert = $req.CreateSelfSigned(
              (Get-Date).AddMinutes(-5), (Get-Date).AddHours(4))
            [IO.File]::WriteAllBytes($pfx,
              $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Pfx, "dryrun-only"))
            "password=dryrun-only" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "mode=selfsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          "path=$pfx" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 签名可执行文件与安装包
        shell: bash
        env:
          CERT: ${{ steps.cert.outputs.path }}
          PFX_PASSWORD: ${{ steps.cert.outputs.password }}
          TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          set -euo pipefail
          WAILS="$(go env GOPATH)/bin/wails3"
          # 没有 RFC 3161 时间戳的签名在证书过期后即不可验证，因此必须有时间戳服务。
          ts="${TIMESTAMP_URL:-http://timestamp.digicert.com}"
          "$WAILS" tool sign --input "bin/${BINARY}.exe" \
            --certificate "$CERT" --password "$PFX_PASSWORD" --timestamp "$ts"
          "$WAILS" task windows:create:nsis:installer
          installer="$(ls bin/${BINARY}-*-installer.exe | head -n1)"
          echo "installer=$installer" >> "$GITHUB_ENV"
          "$WAILS" tool sign --input "$installer" \
            --certificate "$CERT" --password "$PFX_PASSWORD" --timestamp "$ts"

      # 验签分两条路：
      #   正式（真实证书）→ signtool verify /pa /all，走系统信任链，失败即 job 失败；
      #   dry-run（自签）→ 断言"签名存在 + 签名者就是这张临时证书 + 文件哈希与签名一致"。
      # 自签证书不在信任链里，/pa 必然报未trusted；用 NotTrusted 是**预期结果**，
      # 而 HashMismatch / NotSigned 才说明流水线真的坏了。绝不因为"没法建链"就跳过验签。
      - name: 验签（失败即 job 失败）
        shell: pwsh
        env:
          MODE: ${{ steps.cert.outputs.mode }}
          EXPECTED_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @("bin\$env:BINARY.exe")
          $installer = Get-ChildItem "bin\${env:BINARY}-*-installer.exe" | Select-Object -First 1
          if (-not $installer) { Write-Error "安装包不存在"; exit 1 }
          $targets += $installer.FullName
          if ($env:MODE -eq "real") {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Select-Object -Last 1
            if (-not $signtool) { Write-Error "Windows SDK signtool 未找到"; exit 1 }
            foreach ($t in $targets) { & $signtool.FullName verify /pa /all $t; if ($LASTEXITCODE -ne 0) { exit 1 } }
          } else {
            foreach ($t in $targets) {
              $sig = Get-AuthenticodeSignature $t
              Write-Host "$t -> $($sig.Status) / signer=$($sig.SignerCertificate.Thumbprint)"
              if ($sig.Status -notin @("Valid", "NotTrusted")) {
                Write-Error "验签失败：$t 的状态是 $($sig.Status)"; exit 1
              }
              if (-not $sig.SignerCertificate -or
                  $sig.SignerCertificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
                Write-Error "签名者不是本次生成的临时证书：$t"; exit 1
              }
              if ($sig.SignerCertificate.EnhancedKeyUsages.Oid.Value -ne "1.3.6.1.5.5.7.3.3") {
                Write-Error "证书不具备代码签名 EKU：$t"; exit 1
              }
            }
            Write-Host "dry-run 验签通过：签名存在、签名者匹配、文件哈希一致（自签证书不参与系统信任链）"
          }

      - name: 清理证书
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "happywork-signing.pfx")

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.prepare.outputs.label }}
          path: |
            bin/happywork.exe
            bin/happywork-*-installer.exe
          if-no-files-found: error

  # ── macOS：Developer ID 签名 + 公证 + DMG ──
  macos:
    needs: prepare
    if: contains(needs.prepare.outputs.platforms, 'macos')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_CLI_VERSION }}

      - name: 构建 .app
        run: |
          set -euo pipefail
          WAILS="$(go env GOPATH)/bin/wails3"
          "$WAILS" build
          "$WAILS" task darwin:create:app:bundle

      - name: 签名 + 公证（正式标签）
        if: github.event_name == 'push'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in CERT_P12_BASE64 CERT_PASSWORD KEYCHAIN_PASSWORD SIGN_IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!v:-}" ]]; then
              echo "正式标签缺少 Secret：$v —— 拒绝发布未签名/未公证产物" >&2
              exit 1
            fi
          done
          WAILS="$(go env GOPATH)/bin/wails3"
          p12="$RUNNER_TEMP/happywork-signing.p12"
          keychain="$RUNNER_TEMP/happywork.keychain-db"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$p12"
          # 临时钥匙串：只为本次签名存在，job 结束（含失败）删除
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 1800 -u "$keychain"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$(security list-keychains -d user | tr -d '\"' | grep -v "$keychain" | tr '\n' ' ')"
          xcrun notarytool store-credentials happywork-notary \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          "$WAILS" tool sign --input "bin/${BINARY}.app" --identity "$SIGN_IDENTITY" \
            --hardened-runtime --keychain-profile happywork-notary --notarize
          xcrun stapler staple "bin/${BINARY}.app"
          "$WAILS" task darwin:create:dmg
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "bin/${BINARY}.dmg"
          xcrun notarytool submit "bin/${BINARY}.dmg" --keychain-profile happywork-notary --wait
          xcrun stapler staple "bin/${BINARY}.dmg"
          rm -f "$p12"

      - name: 签名（dry-run，ad-hoc）
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          WAILS="$(go env GOPATH)/bin/wails3"
          # ad-hoc 签名没有信任链：只证明流水线可用，不得当作已签名发布
          codesign --force --deep --sign - "bin/${BINARY}.app"
          "$WAILS" task darwin:create:dmg

      - name: 验签（失败即 job 失败）
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "bin/${BINARY}.app"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # dry-run 的 DMG 未签名（没有 Developer ID 身份），因此只在正式路径验
            codesign --verify --strict --verbose=2 "bin/${BINARY}.dmg"
            spctl --assess --type execute --verbose=4 "bin/${BINARY}.app"
            xcrun stapler validate "bin/${BINARY}.app"
            xcrun stapler validate "bin/${BINARY}.dmg"
          fi

      - name: 清理钥匙串
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/happywork.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/happywork-signing.p12"

      - name: 打包 .app（保留签名与扩展属性）
        run: ditto -c -k --sequesterRsrc --keepParent "bin/${BINARY}.app" "bin/${BINARY}.app.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ needs.prepare.outputs.label }}
          path: |
            bin/happywork.dmg
            bin/happywork.app.zip
          if-no-files-found: error

  # ── Linux：GPG 包签名（deb/rpm 内嵌签名 + AppImage 附签）──
  linux:
    needs: prepare
    if: contains(needs.prepare.outputs.platforms, 'linux')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 安装依赖（Wails GUI 栈 + 打包与验签工具）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev \
            dpkg-sig rpm patchelf file zsync libglib2.0-bin

      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_CLI_VERSION }}

      - name: 构建与打包
        run: |
          set -euo pipefail
          WAILS="$(go env GOPATH)/bin/wails3"
          "$WAILS" build
          "$WAILS" task linux:create:deb
          "$WAILS" task linux:create:rpm
          "$WAILS" task linux:create:appimage

      # 正式：导入 Secret 中的私钥并要求显式 LINUX_GPG_KEY_ID；
      # dry-run：生成临时无口令密钥，走完全相同的签名/验签命令。
      - name: 准备 GPG 密钥
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -p --mode=0700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          passfile="$RUNNER_TEMP/happywork-gpg-pass"
          if [[ -n "${GPG_PRIVATE_KEY:-}" ]]; then
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
            if [[ -z "${GPG_KEY_ID:-}" ]]; then
              echo "已配置 LINUX_GPG_PRIVATE_KEY 但 LINUX_GPG_KEY_ID 为空" >&2
              exit 1
            fi
            echo "key_id=$GPG_KEY_ID" >> "$GITHUB_OUTPUT"
            if [[ -n "${GPG_PASSPHRASE:-}" ]]; then
              # 口令只进 0600 临时文件：不进命令行参数，也不进日志
              printf '%s' "$GPG_PASSPHRASE" > "$passfile"
              chmod 600 "$passfile"
              echo "passfile=$passfile" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "正式标签缺少 LINUX_GPG_PRIVATE_KEY：拒绝发布未签名产物" >&2
            exit 1
          else
            # dry-run：临时无口令密钥，走与正式完全相同的签名/验签命令
            gpg --batch --pinentry-mode loopback --passphrase "" --quick-generate-key \
              "HappyWork Dry-Run <dryrun@localhost>" default default never
            echo "key_id=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')" \
              >> "$GITHUB_OUTPUT"
          fi
          # 公钥随产物发布：用户导入后即可验证包签名与校验和签名
          gpg --batch --armor --export > "$RUNNER_TEMP/happywork-release-public.asc"

      - name: 签名 deb / rpm / AppImage
        run: |
          set -euo pipefail
          WAILS="$(go env GOPATH)/bin/wails3"
          key_id="${{ steps.gpg.outputs.key_id }}"
          passfile="${{ steps.gpg.outputs.passfile }}"
          passargs=()
          gpgargs=(--batch --quiet --pinentry-mode loopback --local-user "$key_id")
          if [[ -n "$passfile" ]]; then
            passargs=(--pgp-password "$(cat "$passfile")")
            gpgargs+=(--passphrase-file "$passfile")
          fi
          # rpmsign 通过 ~/.rpmmacros 定位 gpg 程序与密钥
          printf '%%_gpg_name %s\n%%__gpg %s\n' "$key_id" "$(command -v gpg)" > "$HOME/.rpmmacros"
          shopt -s nullglob nocaseglob
          debs=(bin/*.deb) rpms=(bin/*.rpm) images=(bin/*.appimage)
          shopt -u nocaseglob
          if (( ${#debs[@]} == 0 || ${#rpms[@]} == 0 || ${#images[@]} == 0 )); then
            echo "产物不完整（deb=${#debs[@]} rpm=${#rpms[@]} appimage=${#images[@]}），终止" >&2
            exit 1
          fi
          for pkg in "${debs[@]}"; do
            "$WAILS" tool sign --input "$pkg" --pgp-key "$key_id" --role origin "${passargs[@]}"
          done
          for pkg in "${rpms[@]}"; do
            "$WAILS" tool sign --input "$pkg" --pgp-key "$key_id" "${passargs[@]}"
          done
          # AppImage 无法内嵌包签名，采用分离签名 .asc
          for img in "${images[@]}"; do
            gpg "${gpgargs[@]}" --armor --detach-sign --output "$img.asc" "$img"
          done

      - name: 验签（失败即 job 失败）
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          key_id="${{ steps.gpg.outputs.key_id }}"
          passfile="${{ steps.gpg.outputs.passfile }}"
          gpgargs=(--batch --quiet --pinentry-mode loopback --local-user "$key_id")
          if [[ -n "$passfile" ]]; then
            gpgargs+=(--passphrase-file "$passfile")
          fi
          # rpm 只认自己密钥环里的公钥，先导入本次发布公钥
          sudo rpm --import "$RUNNER_TEMP/happywork-release-public.asc" 2>/dev/null ||             rpm --import "$RUNNER_TEMP/happywork-release-public.asc"
          shopt -s nullglob nocaseglob
          for pkg in bin/*.deb; do
            dpkg-sig --verify "$pkg"
          done
          for pkg in bin/*.rpm; do
            # 未签名的包只会报 "digests OK"，所以必须要求 signatures OK
            if ! rpm --checksig "$pkg" | grep -q "digests signatures OK"; then
              echo "rpm 包签名校验失败：$pkg" >&2
              exit 1
            fi
          done
          for img in bin/*.appimage; do
            gpg --verify "$img.asc" "$img"
          done
          shopt -u nocaseglob
          # 本平台校验和；最终 SHA256SUMS 由 release job 汇总三平台后生成
          shopt -u nullglob
          (cd bin && sha256sum -- * > "$GITHUB_WORKSPACE/linux-SHA256SUMS.txt")
          gpg "${gpgargs[@]}" --armor --detach-sign \
            --output linux-SHA256SUMS.txt.asc linux-SHA256SUMS.txt
          (cd bin && sha256sum --check "$GITHUB_WORKSPACE/linux-SHA256SUMS.txt")
          gpg --verify linux-SHA256SUMS.txt.asc linux-SHA256SUMS.txt

      - name: 清理 GPG 密钥
        if: always()
        run: |
          rm -rf "${GNUPGHOME:-$RUNNER_TEMP/gnupg}" "${{ steps.gpg.outputs.passfile }}" \
            "$HOME/.rpmmacros"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ needs.prepare.outputs.label }}
          path: |
            bin/
            ${{ runner.temp }}/happywork-release-public.asc
          if-no-files-found: error

  # ── 发布：仅正式标签；汇总三平台产物生成最终 SHA256SUMS 并签名 ──
  release:
    needs: [prepare, windows, macos, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载三平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true

      - name: 汇总校验和并签名
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY:-}" || -z "${GPG_KEY_ID:-}" ]]; then
            echo "缺少 LINUX_GPG_PRIVATE_KEY / LINUX_GPG_KEY_ID：无法签署发布校验和" >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -p --mode=0700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Linux job 只覆盖本平台产物；最终清单在这里对全部发布物生成
          rm -f dist/SHA256SUMS dist/SHA256SUMS.asc
          (cd dist && find . -maxdepth 1 -type f ! -name "SHA256SUMS*" -print0 |
            sort -z | xargs -0 sha256sum > SHA256SUMS)
          passargs=()
          if [[ -n "${GPG_PASSPHRASE:-}" ]]; then
            # 口令只进 0600 临时文件，不进命令行参数
            printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass"
            chmod 600 "$RUNNER_TEMP/gpg-pass"
            passargs=(--passphrase-file "$RUNNER_TEMP/gpg-pass")
          fi
          gpg --batch --pinentry-mode loopback "${passargs[@]}" \
            --local-user "$GPG_KEY_ID" --armor --detach-sign \
            --output dist/SHA256SUMS.asc dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --armor --export "$GPG_KEY_ID" > dist/happywork-release-public.asc
          rm -rf "$GNUPGHOME"
          ls -l dist

      - name: 发布说明
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          {
            echo "## HappyWork v$version"
            echo
            echo "签名产物：Windows（exe + NSIS 安装包，Authenticode + RFC3161 时间戳）、"
            echo "macOS（.app.zip + .dmg，Developer ID 签名并公证）、"
            echo "Linux（.deb / .rpm / AppImage，GPG 签名）。"
            echo
            echo "### 验签"
            echo '```bash'
            echo "# 通用：校验和与 GPG 签名"
            echo "gpg --import happywork-release-public.asc"
            echo "gpg --verify SHA256SUMS.asc SHA256SUMS && sha256sum --check SHA256SUMS"
            echo "# Windows"
            echo "signtool verify /pa /all happywork.exe"
            echo "# macOS"
            echo "codesign --verify --deep --strict --verbose=2 happywork.app"
            echo "spctl --assess --type execute happywork.app"
            echo "xcrun stapler validate happywork.app"
            echo "# Linux"
            echo "dpkg-sig --verify happywork_*.deb"
            echo "rpm --checksig happywork-*.rpm"
            echo '```'
            echo
            echo "### 已知限制"
            echo "- 本版本没有应用内更新器，也不会静默自动更新：升级需手动下载并验签。"
            echo "- 审计链是本地完整性护栏，不做外部锚定：能发现改行/删行/插队/链头不一致，"
            echo "  不防拥有数据库完整写权限并重算整条链的攻击者。"
            echo "- 文件备份每文件保留最近 20 版，备份区软上限 512 MiB；超限拒绝新的覆盖写，而不是静默丢版本。"
          } > release-notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "没有任何产物可上传，终止发布" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "HappyWork v${{ needs.prepare.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${files[@]}"
